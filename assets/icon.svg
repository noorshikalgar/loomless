<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loomless-icon-title">
  <title id="loomless-icon-title">Loomless</title>

  <rect x="0" y="0" width="512" height="512" rx="64" fill="#0D0D0D"/>

  <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6">

    <!-- row 1: hand-drawn square (freehand tool) — amber + alpha fill,
         same as the app's .drag-overlay.rect live preview -->
    <path d="M 100,108 L 94,88 L 198,82 L 204,190 L 88,184 L 102,94"
          fill="rgba(255,176,32,0.16)" stroke="#FFB020"/>

    <!-- row 2: two plain squares -->
    <rect x="96" y="208" width="96" height="96" rx="14" fill="none" stroke="#C9C9C9"/>
    <rect x="208" y="208" width="96" height="96" rx="14" fill="none" stroke="#C9C9C9"/>

    <!-- row 3, left: circle (circle tool) — violet, distinct from the
         amber square, still with the same alpha-fill-while-dragging
         treatment -->
    <circle cx="144" cy="368" r="44" fill="rgba(168,85,247,0.18)" stroke="#A855F7"/>

    <!-- row 3, middle: plain square -->
    <rect x="208" y="320" width="96" height="96" rx="14" fill="none" stroke="#C9C9C9"/>

    <!-- row 3, right: a square whose bottom edge breaks open and exits
         as an arrow (arrow tool) — the whole piece is red, matching
         the app's real line/arrow/freehand color -->
    <path d="M 320,402 L 320,334 Q 320,320 334,320 L 402,320 Q 416,320 416,334 L 416,402"
          fill="none" stroke="#FF3B30"/>
    <path d="M 320,402 Q 320,416 334,416 L 456,416" fill="none" stroke="#FF3B30"/>
    <path d="M 456,416 L 440,404 M 456,416 L 440,430" fill="none" stroke="#FF3B30"/>
  </g>

  <!-- numbered badges, matching the app's real annotation badges
       (background = that annotation's own color, white number) —
       positioned top-right of each colored shape -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="17"
     font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="204" cy="82" r="15" fill="#FFB020" stroke="#0D0D0D" stroke-width="2"/>
    <text x="204" y="88">1</text>

    <circle cx="188" cy="324" r="15" fill="#A855F7" stroke="#0D0D0D" stroke-width="2"/>
    <text x="188" y="330">2</text>

    <circle cx="416" cy="320" r="15" fill="#FF3B30" stroke="#0D0D0D" stroke-width="2"/>
    <text x="416" y="326">3</text>
  </g>
</svg>
